# === General Settings ===

general:

  start_date: "1993-01-01"
  end_date: "1993-12-31"

  ssh_mode: 'cmems' #options: cmems, neurost

  overwrite_download: false 
#if we want to redownload the data even if already has been in the past
#if false, it will still try to download final data even if interim has been downloaded in the past. If final not available and interim already downloaded it won't redownload interim
#if true, it will redownload final and/or interim whether it has been already downloaded or not

  overwrite_current: false 
#if we want to recompute the final currents even if already has been in the past 
#cannot be false if overwrite_download is true
#if false, it will not recompute the final currents that exist already but it will still recompute currents that are currently interim (should be changed to: only compute currents that were interim if final input files are available)
#if true, it will recompute currents whether the output file already exists or not

  do_intermediate_checks: false 
#make daily plots of interpolated SSH, SST, winds fields and SSH and SST gradients
#will overwrite existing plots if currents are computed

  plot_currents: false
#won't overwrite existing plot unless overwrite_current is true
#will replace interim plot by final if final current now available

  do_validation: false 
#will overwrite existing validation pdf for this time range
#better to run the validation on its own

  do_save_colocation: false 
#save drifter/Oscar colocation ncfiles
#do not do anything if do_validation is false

  do_eq: true 
#equatorial treatment for current computation


plot_currents:

  region: "global" #options: global, gulf_stream, indian_ocean, caribbean, australia_nz
